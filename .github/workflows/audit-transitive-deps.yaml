name: Audit Transitive Dependencies

# Flags major version changes in C library deps (FFmpeg, OpenSSL, ...) that can
# break dependents, like FFmpeg 9.0 broke waypipe.

on:
  pull_request:
    paths:
      - '**/flake.lock'
  schedule:
    - cron: '0 10 * * 4' # Thursday 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        repo: [nix-config, nix-devshells, nix-presets, nix-packages, nix-hardware]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kleinbem/${{ matrix.repo }}
          path: ${{ matrix.repo }}
          fetch-depth: 0
          persist-credentials: false

      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          nix-path: nixpkgs=channel:nixos-unstable

      - name: Audit ${{ matrix.repo }}
        id: audit
        run: |
          if [ -f "${{ matrix.repo }}/flake.lock" ]; then
            set -o pipefail
            audit_failed=0
            ./tools/audit-transitive-deps.sh "${{ matrix.repo }}" 2>&1 | tee "audit-${{ matrix.repo }}.log" || audit_failed=1
            if [ "$audit_failed" = "1" ]; then
              echo "has_breaking_changes=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "✓ ${{ matrix.repo }} has no flake.lock, skipping"
          fi

      - name: Comment on PR if breaking changes detected
        if: github.event_name == 'pull_request' && steps.audit.outputs.has_breaking_changes == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('audit-${{ matrix.repo }}.log', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Transitive Dependency Alert (${{ matrix.repo }})\n\n\`\`\`\n${log}\n\`\`\``
            });

      - name: Archive audit logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-transitive-deps-${{ matrix.repo }}-${{ github.run_id }}
          path: audit-${{ matrix.repo }}.log
          retention-days: 90

  summary:
    runs-on: ubuntu-latest
    needs: audit
    if: always()
    steps:
      - name: Check audit results
        run: |
          {
            echo "## 🔗 Transitive Dependency Audit"
            echo ""
            echo "Scanned for major version changes in:"
            echo "- FFmpeg, OpenSSL, curl, zlib"
            echo "- libpng, libjpeg, lua, Python3"
            echo "- PostgreSQL, libxml2, and more"
            echo ""
            echo "**Impact:** Detects breaks like FFmpeg 9.0 incompatibility before merging"
          } >> "$GITHUB_STEP_SUMMARY"
