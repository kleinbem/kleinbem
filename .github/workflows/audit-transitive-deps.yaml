name: Audit Transitive Dependencies

# Monitor for major version changes in C library dependencies (FFmpeg, OpenSSL, etc.)
# that could break dependent packages (like the FFmpeg 9.0 → waypipe issue).
#
# Runs:
# - On flake.lock changes (catches updates before merge)
# - Weekly (detects indirect updates)
# - Manual trigger (on-demand audit)

on:
  pull_request:
    paths:
      - '**/flake.lock'
  schedule:
    - cron: '0 10 * * 4' # Thursday 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [nix-config, nix-devshells, nix-presets, nix-packages, nix-hardware]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          nix-path: nixpkgs=channel:nixos-unstable

      - name: Audit ${{ matrix.repo }}
        id: audit
        run: |
          if [ -f "${{ matrix.repo }}/flake.lock" ]; then
            ./kleinbem/tools/audit-transitive-deps.sh "${{ matrix.repo }}" 2>&1 | tee audit-${{ matrix.repo }}.log || audit_failed=1
            if [ "${audit_failed:-0}" = "1" ]; then
              echo "has_breaking_changes=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "✓ ${{ matrix.repo }} has no flake.lock, skipping"
          fi

      - name: Comment on PR if breaking changes detected
        if: github.event_name == 'pull_request' && steps.audit.outputs.has_breaking_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('audit-${{ matrix.repo }}.log', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Transitive Dependency Alert (${{ matrix.repo }})\n\n\`\`\`\n${log}\n\`\`\``
            });

      - name: Archive audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-transitive-deps-${{ matrix.repo }}-${{ github.run_id }}
          path: audit-${{ matrix.repo }}.log
          retention-days: 90

  summary:
    runs-on: ubuntu-latest
    needs: audit
    if: always()
    steps:
      - name: Check audit results
        run: |
          echo "## 🔗 Transitive Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanned for major version changes in:" >> $GITHUB_STEP_SUMMARY
          echo "- FFmpeg, OpenSSL, curl, zlib" >> $GITHUB_STEP_SUMMARY
          echo "- libpng, libjpeg, lua, Python3" >> $GITHUB_STEP_SUMMARY
          echo "- PostgreSQL, libxml2, and more" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Impact:** Detects breaks like FFmpeg 9.0 incompatibility before merging" >> $GITHUB_STEP_SUMMARY
