name: Check Flake Lock Freshness

# Weekly check that flake.lock files are being kept current
# Alerts if any flake.lock is >30 days old (stale dependencies)

on:
  schedule:
    - cron: '0 9 * * 3' # Wednesday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          nix-path: nixpkgs=channel:nixos-unstable

      - name: Load workspace devshell
        run: |
          nix flake update
          nix develop .#workspace --command just check-flake-lock-age | tee flake-lock-age.log

      - name: Check for stale locks
        id: check
        run: |
          if grep -q "⚠️" flake-lock-age.log; then
            echo "has_stale=true" >> $GITHUB_OUTPUT
          else
            echo "has_stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Alert on stale locks
        if: steps.check.outputs.has_stale == 'true'
        run: |
          echo "## 📅 Stale Flake Locks Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following flake.lock files are >30 days old and should be refreshed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat flake-lock-age.log >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Remediation:** Run \`just in <repo> flake update\` to refresh" >> $GITHUB_STEP_SUMMARY

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock-age-${{ github.run_id }}
          path: flake-lock-age.log
          retention-days: 90
