name: Check Flake Lock Freshness

# Weekly check that flake.lock files are being kept current
# Alerts if any flake.lock is >30 days old (stale dependencies)

on:
  schedule:
    - cron: '0 9 * * 3' # Wednesday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          nix-path: nixpkgs=channel:nixos-unstable

      - name: Load workspace devshell
        run: |
          nix flake update
          nix develop .#workspace --command just check-flake-lock-age | tee flake-lock-age.log

      - name: Check for stale locks
        id: check
        run: |
          if grep -q "⚠️" flake-lock-age.log; then
            echo "has_stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert on stale locks
        if: steps.check.outputs.has_stale == 'true'
        run: |
          {
            echo "## 📅 Stale Flake Locks Detected"
            echo ""
            echo "The following flake.lock files are >30 days old and should be refreshed:"
            echo ""
            cat flake-lock-age.log
            echo ""
            echo "**Remediation:** Run \`just in <repo> flake update\` to refresh"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-lock-age-${{ github.run_id }}
          path: flake-lock-age.log
          retention-days: 90
