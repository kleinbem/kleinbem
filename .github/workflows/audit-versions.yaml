name: Audit Versions

# Weekly list of pinned SDK/tool versions in the fleet's public nix-* and
# openwrt-* repos, in the run summary. Fails when the scan can't run.

on:
  schedule:
    - cron: '0 9 * * 2' # Tuesday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash shell runs with pipefail, so `| tee` can't hide a failure.
defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone the public fleet repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch-public-repos.sh repos.nix .repos

      - name: Scan
        run: |
          tools/audit-versions.sh .repos | tee audit-versions.log
          {
            echo '```'
            cat audit-versions.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Archive audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-versions-${{ github.run_id }}
          path: audit-versions.log
          retention-days: 90
