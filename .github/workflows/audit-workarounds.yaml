name: Audit Workarounds

# Weekly look at every workaround in the fleet's public repos (repos.nix) with
# kleinbem/nix-toolbox's nix-check-workarounds: ones without an upstream link,
# and linked issues or PRs that are merged or closed, so the workaround can go.
# The report goes into one issue, and only when it differs from the last one.

on:
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-workarounds
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Audit: workarounds"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kleinbem/nix-toolbox
          path: .nix-toolbox
          persist-credentials: false

      - name: Check every public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .repos
          {
            echo "Workarounds without an upstream link, and linked reports that are merged or closed."
            echo "Run \`nix-check-workarounds --states <repo>\` locally for the current state."
            echo
          } >report.md
          findings=0
          while read -r slug; do
            # Private repos can't be cloned with this token; they're skipped.
            [[ "$(gh repo view "$slug" --json isPrivate --jq .isPrivate </dev/null 2>/dev/null)" == false ]] || continue
            git clone -q --depth 1 "https://github.com/$slug" ".repos/${slug//\//_}" </dev/null
            out="$(.nix-toolbox/bin/nix-check-workarounds --states ".repos/${slug//\//_}" </dev/null 2>&1 || true)"
            lines="$(grep -v ' workaround comments, ' <<<"$out" || true)"
            [[ -n "$lines" ]] || continue
            findings=1
            {
              echo "### $slug"
              sed -E 's/^/- /' <<<"$lines"
              echo
            } >>report.md
          done < <(grep -oE 'github\.com:[^"]+\.git' repos.nix | sed -E 's/^github\.com://; s/\.git$//' | sort -u)
          echo "findings=$findings" >>"$GITHUB_ENV"
          cat report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Report
        if: env.findings == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --limit 100 --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")"
          if [[ -z "$issue" ]]; then
            gh issue create --title "$ISSUE_TITLE" --body-file report.md
            exit 0
          fi
          last="$(gh issue view "$issue" --json body,comments --jq '(.comments | last | .body) // .body')"
          if [[ "$last" != "$(cat report.md)" ]]; then
            gh issue comment "$issue" --body-file report.md
          fi
