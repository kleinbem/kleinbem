name: Audit Workarounds

# Weekly look at every workaround in the fleet's public repos (repos.nix) with
# kleinbem/nix-toolbox's nix-check-workarounds: ones without an upstream link,
# and linked issues or PRs that are merged or closed, so the workaround can go.
# The report goes into one issue, and only when it differs from the last one.
# no-link: describes the audit, not a workaround.

on:
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-workarounds
  cancel-in-progress: false

# An explicit bash shell runs with pipefail.
defaults:
  run:
    shell: bash

env:
  ISSUE_TITLE: "Audit: workarounds"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kleinbem/nix-toolbox
          path: .nix-toolbox
          persist-credentials: false

      - name: Check every public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .repos
          {
            echo "Workarounds without an upstream link, and linked reports that are merged or closed."
            echo "Run \`nix-check-workarounds --states <repo>\` locally for the current state."
            echo
          } >report.md
          findings=0
          checked=0
          hidden=()
          while read -r slug; do
            # The job token sees public repos only: a 404 is a private (or
            # gone) repo, listed in the report; any other failure fails the run.
            if ! err="$(gh api "repos/$slug" --jq .full_name </dev/null 2>&1 >/dev/null)"; then
              if [[ "$err" == *"HTTP 404"* ]]; then
                hidden+=("$slug")
                continue
              fi
              echo "::error::looking up $slug failed: $err"
              exit 1
            fi
            git clone -q --depth 1 "https://github.com/$slug" ".repos/${slug//\//_}" </dev/null
            checked=$((checked + 1))
            # Exit 1 means findings; anything higher is an error.
            rc=0
            out="$(.nix-toolbox/bin/nix-check-workarounds --states ".repos/${slug//\//_}" </dev/null 2>&1)" || rc=$?
            if ((rc > 1)); then
              echo "::error::nix-check-workarounds failed on $slug (exit $rc): $out"
              exit 1
            fi
            lines="$(grep -v ' workaround comments, ' <<<"$out" || true)"
            [[ -n "$lines" ]] || continue
            findings=1
            {
              echo "### $slug"
              sed -E 's/^/- /' <<<"$lines"
              echo
            } >>report.md
          done < <(grep -oE 'github\.com:[^"]+\.git' repos.nix | sed -E 's/^github\.com://; s/\.git$//' | sort -u)
          # The repo list comes from a process substitution, whose failure set -e doesn't see.
          if ((checked == 0)); then
            echo "::error::no repo was checked"
            exit 1
          fi
          if ((${#hidden[@]} > 0)); then
            echo "Not checked (private or gone, not visible to the job token): ${hidden[*]}" >>report.md
            echo >>report.md
          fi
          if ((findings == 0)); then
            if ((${#hidden[@]} > 0)); then
              echo "No findings in the checked repos (the ones above weren't checked)." >>report.md
            else
              echo "No findings: every workaround links its report, and none of them is merged or closed." >>report.md
            fi
          fi
          echo "findings=$findings" >>"$GITHUB_ENV"
          cat report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/report-issue.sh "$ISSUE_TITLE" report.md "$findings"
